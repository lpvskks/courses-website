<header class="header">
  <div class="header__brand">
    <span class="header__logo">Марсик</span>
  </div>

  <div class="header__right">
    <nav class="header__nav">
      <a routerLink="/courses" routerLinkActive="active" class="header__link"> Курсы </a>

      <button type="button" class="header__link header__logout-btn" (click)="logout()">
        Выйти
      </button>
    </nav>

    <button
      class="profile-btn"
      type="button"
      matTooltip="Открыть профиль"
      matTooltipPosition="below"
      (click)="openProfile()"
    >
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</header>
